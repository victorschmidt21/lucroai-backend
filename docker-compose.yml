services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lucroai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lucroai}
      POSTGRES_DB: ${POSTGRES_DB:-lucroai}
    ports:
      - '${POSTGRES_PORT:-55440}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o banco lucroai_test (e2e) na primeira subida do volume
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      # Polling: eventos de arquivo não atravessam bind mounts no Docker Desktop (Windows/macOS)
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      PORT: ${PORT:-3100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lucroai}:${POSTGRES_PASSWORD:-lucroai}@postgres:5432/${POSTGRES_DB:-lucroai}?schema=public
    ports:
      - '${PORT:-3100}:${PORT:-3100}'
    volumes:
      - ./src:/usr/src/app/src
      - ./test:/usr/src/app/test
      - ./prisma:/usr/src/app/prisma
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
